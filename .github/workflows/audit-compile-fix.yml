name: Apply audit compile fix

on:
  push:
    branches:
      - audit/production-readiness-2026-09-06
    paths:
      - .compile-fix-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply duplicate recording-control fix
        run: python3 tools/fix_recording_compile.py
      - name: Commit corrected complete file
        run: |
          git config user.name "cueflow-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/components/ScriptDialogs.kt
          git commit -m "fix: align duplicate recording control with permission flow"
          git push origin HEAD:${GITHUB_REF_NAME}
