name: Apply audit phase two

on:
  push:
    branches:
      - audit/production-readiness-2026-09-06
    paths:
      - .phase2-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic playback and service fixes
        run: python3 tools/apply_audit_phase2.py

      - name: Commit corrected complete files
        run: |
          git config user.name "cueflow-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/components/ScriptDialogs.kt \
                  app/src/main/java/com/example/service/FloatingPrompterService.kt \
                  app/src/main/java/com/example/ui/components/SettingsDialog.kt
          git commit -m "fix: harden recording voice remote and overlay behavior"
          git push origin HEAD:${GITHUB_REF_NAME}
