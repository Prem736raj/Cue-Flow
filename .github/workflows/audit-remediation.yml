name: Audit remediation validation

on:
  push:
    branches:
      - audit/production-readiness-2026-09-06
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Apply phase-one remediation
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[phase1-applied]')
        run: |
          if [ ! -f .audit-phase1-applied ]; then
            python3 tools/apply_audit_phase1.py
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
            touch .audit-phase1-applied
            git config user.name "cueflow-audit-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "audit: apply phase one remediation [phase1-applied]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Ensure wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
